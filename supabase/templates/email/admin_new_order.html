<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Order Alert - Hardware Pasal Admin</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background: #ea580c; color: white; padding: 20px; border-radius: 8px 8px 0 0; }
    .content { background: #fff; padding: 30px; border: 1px solid #e5e7eb; border-top: none; }
    .footer { background: #f9fafb; padding: 20px; border-radius: 0 0 8px 8px; border: 1px solid #e5e7eb; border-top: none; text-align: center; color: #6b7280; font-size: 14px; }
    .order-card { background: #f3f4f6; padding: 20px; border-radius: 8px; margin: 20px 0; }
    .detail { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e5e7eb; }
    .detail:last-child { border-bottom: none; }
    .button { display: inline-block; background: #ea580c; color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <div class="header">
    <h1 style="margin: 0;">⚡ Admin Alert</h1>
    <p style="margin: 10px 0 0; opacity: 0.9;">New Order Received</p>
  </div>
  
  <div class="content">
    <p>A new order has been placed on Hardware Pasal.</p>
    
    <div class="order-card">
      <div class="detail"><span>Order ID</span><strong>#{{order_id_short}}</strong></div>
      <div class="detail"><span>Customer</span><strong>{{customer_name}}</strong> ({{customer_phone}})</div>
      <div class="detail"><span>Shop</span><strong>{{shop_name}}</strong></div>
      <div class="detail"><span>Total</span><strong>Rs. {{total}}</strong></div>
      <div class="detail"><span>Payment</span><strong>{{payment_method}}</strong></div>
      <div class="detail"><span>Time</span><strong>{{created_at}}</strong></div>
    </div>
    
    <p style="text-align: center; margin: 30px 0;">
      <a href="{{admin_order_url}}" class="button">View in Admin Panel</a>
    </p>
  </div>
  
  <div class="footer">
    <p>Hardware Pasal Admin Panel</p>
  </div>
</body>
</html>
